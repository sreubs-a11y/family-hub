<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2F5F8">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Family Hub">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Outfit:wght@600;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Space+Grotesk:wght@600;700&family=Nunito:wght@700;900&display=swap">
<style>
input[type=url],input[type=password]{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.proto.st-saving{color:var(--accent)}
.proto.st-error,.proto.st-net{color:var(--protein)}
.setup{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));overflow:auto}
.setup-card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
.setup-card h1{font-size:30px;font-weight:800}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px}
.setup-card code{font-size:11px;word-break:break-all;background:var(--surface-2);padding:1px 4px;border-radius:4px}
.setup-card .link{align-self:center}
.err{background:var(--surface);border:1px solid var(--protein);color:var(--protein);border-radius:12px;padding:10px 12px;font-size:14px}

/* Layout: single phone column, sticky header with a menu button top-left opening a side drawer; colour-coded entries like a fridge calendar */
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --surface-2:#E8EDF2; --line:#D9E0E7;
  --fg:#16202B; --muted:#5E6B78; --accent:#2F5BEA; --accent-ink:#FFFFFF; --accent-soft:#E3EAFE;
  --pickup:#C77700; --pickup-soft:#FFF1DC;
  --meal:#2E8A57; --meal-soft:#E0F3E8;
  --event:#7A4FD0; --event-soft:#EFE7FD; --protein:#C2453A; --bday:#C2417A; --bday-soft:#FCE4EF;
  --scrim:rgba(10,15,20,.45);
  --font-display:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --font-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px; --rb:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#18212B; --surface-2:#212C38; --line:#2C3946;
  --fg:#E8EEF4; --muted:#93A1AF; --accent:#7C9BFF; --accent-ink:#0F151C; --accent-soft:#1F2C52;
  --pickup:#F0A53A; --pickup-soft:#3A2B12; --meal:#5CC48A; --meal-soft:#173325;
  --event:#B596FF; --event-soft:#2A2145; --protein:#FF8A7A; --bday:#F58BB8; --bday-soft:#3A1C2B; --scrim:rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#18212B; --surface-2:#212C38; --line:#2C3946;
  --fg:#E8EEF4; --muted:#93A1AF; --accent:#7C9BFF; --accent-ink:#0F151C; --accent-soft:#1F2C52;
  --pickup:#F0A53A; --pickup-soft:#3A2B12; --meal:#5CC48A; --meal-soft:#173325;
  --event:#B596FF; --event-soft:#2A2145; --protein:#FF8A7A; --bday:#F58BB8; --bday-soft:#3A1C2B; --scrim:rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:520px;margin:0 auto}
body.wide .app{max-width:1400px}
@media (min-width:700px){body.wide .mcal{margin-inline:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}body.wide .calbar{padding:10px 12px}}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;display:flex;align-items:center;gap:12px}
.menu-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;padding:0}
header.top .ttl{flex:1;min-width:0}
header.top .eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top h1{font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top:has(.hnav:not(:empty)) h1{font-size:21px}
.hnav{display:flex;gap:6px;flex:none}.hnav:empty{display:none}.hnav .pg{width:36px;height:36px}
.proto{font-size:11px;font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:4px 9px;white-space:nowrap}

main{display:flex;flex-direction:column;gap:22px;padding-top:6px}
section{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-head h2{font-size:16px;font-weight:700}
.hint{font-size:13px;color:var(--muted)}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;padding:4px 0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);min-width:0;width:100%;background:none;text-align:left;border-left:0;border-right:0;border-bottom:0}
.rows>.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted)}
.time{font-size:13px;font-weight:600;width:56px;flex:none;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.tag.pickup{background:var(--pickup-soft);color:var(--pickup)}
.tag.meal{background:var(--meal-soft);color:var(--meal)}
.tag.event{background:var(--event-soft);color:var(--event)}
.tag.plain{background:var(--surface-2);color:var(--muted)}
.stripe{width:4px;align-self:stretch;border-radius:4px;flex:none}
.stripe.birthday{background:var(--bday)}.tag.birthday{background:var(--bday-soft);color:var(--bday)}.dots .birthday{background:var(--bday)}
.stripe.pickup{background:var(--pickup)}.stripe.meal{background:var(--meal)}.stripe.event{background:var(--event)}
.who{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.who.R{background:var(--accent-soft);color:var(--accent)}
.who.T{background:var(--event-soft);color:var(--event)}
.who.B{background:var(--surface-2);color:var(--muted)}
.by{font-weight:600}.by.R{color:var(--accent)}.by.T{color:var(--event)}
.lock{display:inline-flex;vertical-align:-2px;margin-right:2px}
.me{display:flex;align-items:center;gap:10px;padding:10px;margin:0 0 10px;background:var(--surface-2);border-radius:12px;font-size:13px}
.me .main{flex:1;min-width:0}
.me b{display:block;font-size:15px}
.btn.icon{padding:0 14px;display:grid;place-items:center;align-self:stretch}

.dinner{display:flex;gap:14px;align-items:center;padding:14px;background:var(--meal-soft);border:0;border-radius:var(--r);text-align:left;width:100%}
.dinner .ico{width:46px;height:46px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--meal);flex:none}
.dinner .k{font-size:12px;font-weight:600;color:var(--meal);text-transform:uppercase;letter-spacing:.06em}
.dinner .n{font-family:var(--font-display);font-weight:700;font-size:18px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tile .big{font-family:var(--font-display);font-size:26px;font-weight:800}
.tile .s{font-size:13px;color:var(--muted)}

.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:var(--surface);flex:none;display:grid;place-items:center;padding:0}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.done .t{text-decoration:line-through;color:var(--muted)}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:var(--rb);padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pager h2{font-size:17px;font-weight:700}
.pg{width:36px;height:36px;border-radius:min(var(--rb),18px);border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;font-size:18px;font-weight:700}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:0;background:var(--surface);border-radius:12px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.day .dn{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
.day .dd{font-family:var(--font-display);font-weight:700;font-size:17px}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:5px;height:5px;border-radius:50%}
.day.sel,.mcell.sel{background:var(--accent);color:var(--accent-ink)}
.day.sel .dn{color:var(--accent-ink);opacity:.8}
.dots .bins{background:var(--muted)}.dots .pickup{background:var(--pickup)}.dots .meal{background:var(--meal)}.dots .event{background:var(--event)}

.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.month .wd{font-size:11px;font-weight:600;color:var(--muted);text-align:center;text-transform:uppercase;padding-bottom:2px}
.mcell{border:0;background:var(--surface);border-radius:10px;aspect-ratio:1/1.05;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;min-width:0}
.mcell .dd{font-weight:600;font-size:15px}
.mcell.today:not(.sel){box-shadow:inset 0 0 0 2px var(--accent)}
.mcell.past:not(.sel) .dd{color:var(--muted)}
.mcell.blank{background:none}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.addbar{display:flex;gap:8px}
input[type=text],input[type=number],input[type=date],input[type=time],select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.btn{border:0;border-radius:var(--rb);padding:11px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.aisle{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:2px 2px 0}

.snap{display:flex;gap:14px;align-items:center;padding:16px;border:1.5px dashed var(--accent);background:var(--accent-soft);border-radius:var(--r);width:100%;text-align:left;color:var(--fg)}
.snap .ico{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.recipes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rcard{padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.rcard .sw{height:64px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--meal);background:var(--meal-soft)}
.rcard .b{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.rcard .t{font-weight:600}
.rcard .s{font-size:12px;color:var(--muted)}
.dcol{width:44px;flex:none;display:flex;flex-direction:column;line-height:1.1}
.dcol b{font-size:13px}
.dcol span{font-size:12px;color:var(--muted)}
.holding{border-style:dashed}
.grip{touch-action:none;cursor:grab;width:30px;height:38px;margin:-8px 0 -8px -6px;display:grid;place-items:center;color:var(--muted);flex:none;border-radius:8px}
.grip:active{cursor:grabbing}
.drag-ghost{position:fixed;z-index:40;pointer-events:none;background:var(--surface);box-shadow:0 10px 28px rgba(0,0,0,.22);border-radius:12px;border:1px solid var(--line)!important;opacity:.96}
.dragging{opacity:.3}
.over{background:var(--meal-soft)!important;box-shadow:inset 0 0 0 2px var(--meal)}
body.is-dragging{user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
.gwrap{position:relative;display:inline-flex}
.gbtn{position:relative}
.gbtn b{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:10px;display:grid;place-items:center;padding:0 3px}
.gpop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 32px rgba(0,0,0,.25);padding:6px}
.gpop-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px}
.gopt{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--fg);padding:9px 8px;border-radius:10px;font-size:14px;font-weight:600;text-align:left}
.gopt:hover{background:var(--surface-2)}
.gopt i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.gbox{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--accent-ink)}
.gopt.on .gbox{background:var(--accent);border-color:var(--accent)}
.gbox svg{width:14px;height:14px}
.gpop-f{display:flex;justify-content:space-between;padding:8px 8px 4px;border-top:1px solid var(--line);margin-top:4px}
.gchips{display:flex;gap:6px;overflow-x:auto;padding:0 max(12px, env(safe-area-inset-left,0px)) 8px;scrollbar-width:none}
.gchips::-webkit-scrollbar{display:none}
.gchip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 10px 4px 7px;font-size:12px;font-weight:600}
.gchip i{width:10px;height:10px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.gchip.on{color:var(--fg);border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.gchip.on i{background:var(--c)}
.gchip.edit{padding:4px 10px;color:var(--accent)}
.row.past .t{text-decoration:line-through;text-decoration-thickness:1.5px}
.row.past{opacity:.55}
.time small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:1px}
.divrow{padding:8px 14px 6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-top:1px solid var(--line)}
.mini.chip.cyc{min-width:54px;justify-content:center;font-weight:700}
.mini.chip.cyc.who-R{color:var(--r-ink,var(--fg))}
#evGroupSel{margin-top:6px;width:100%}
.evc.cc.cc,.evc.bar.cc.cc{background:color-mix(in srgb,var(--c) 22%,var(--surface));color:color-mix(in srgb,var(--c) 72%,var(--fg))}
.stripe.cc.cc{background:var(--c)}
.colpick{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.colpick button{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);background:var(--c);box-shadow:0 0 0 1px var(--line);padding:0}
.colpick button.none{background:linear-gradient(135deg,var(--pickup) 0 33%,var(--event) 33% 66%,var(--meal) 66%)}
.colpick button.on{box-shadow:0 0 0 2px var(--fg)}
.bdot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 1.5px var(--surface)}
.bdots{display:flex;gap:2px;align-items:center}
.evc.binc{display:flex;align-items:center;gap:2px;background:var(--surface-2);color:var(--fg)}
.evc.binc .bdot{width:8px;height:8px}
.binbar{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 4px;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);text-align:left;color:var(--fg)}
.binbig{width:26px;height:30px;border-radius:5px 5px 7px 7px;flex:none;box-shadow:inset 0 5px 0 rgba(0,0,0,.18)}
.binpick{display:flex;flex-wrap:wrap;gap:8px}
.binpick button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 6px;font-weight:600;font-size:13px}
.binpick i{width:20px;height:20px;border-radius:50%}
.binpick button.on{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.bdwrap{padding:0;gap:0}
.bdwrap .bdrow{flex:1;min-width:0;border:0;background:none}
.bdwrap.off .bdrow{opacity:.55}
.eye{border:0;background:none;color:var(--muted);width:48px;align-self:stretch;display:grid;place-items:center;flex:none}
.eye.on{color:var(--bday)}
.revbanner{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;width:100%;margin:0 0 10px;padding:12px 14px;border:0;border-radius:var(--r);background:var(--accent-soft);color:var(--fg);text-align:left}
.revbanner span{color:var(--accent);font-weight:600}
.row.imp .dupnote{color:var(--pickup)}
.tcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tcard{border:2px solid transparent;padding:10px;display:flex;flex-direction:column;align-items:stretch;gap:8px;font-weight:700;font-size:13px;box-shadow:0 0 0 1px var(--line)}
.tcard.on{border-color:var(--fg)}
.tprev{display:flex;align-items:center;justify-content:space-between;border:1px solid;padding:8px 10px}
.tprev b{font-size:20px;line-height:1}
.tprev i{width:26px;height:14px;display:block}
.modes{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr)}
.gcat-empty{display:none;align-items:center;gap:8px;margin:10px 0;padding:12px 14px;border:2px dashed var(--line);border-radius:14px;font-weight:700;font-size:13px;color:var(--muted)}
body.is-dragging .gcat-empty{display:flex}
.gcat{border-radius:16px;transition:box-shadow .12s}
.gcat.over,.gcat-empty.over{box-shadow:0 0 0 2px var(--accent);border-color:var(--accent)}
.syncbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stripe.todo{background:var(--accent)}.tag.todo{background:var(--accent-soft);color:var(--accent);margin-right:4px}
.minis{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mini{display:inline-flex;align-items:center;gap:4px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 2px 0 6px;font-size:13px;flex:0 0 auto;max-width:100%}
.mini input,.mini select{border:0!important;background:none!important;padding:0 4px!important;font-size:13px!important;width:auto!important;min-width:0;height:32px;color:var(--fg)}
.mini input[type=date]{max-width:8em;font-variant-numeric:tabular-nums}.mini input[type=time]{max-width:5.6em}
.minis .segsm button{padding:5px 8px;font-size:12.5px}
.minis .segsm{height:34px;padding:2px}

const FRAC={'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125};

function fmtAmount(v,dec){
  if(dec)return String(Math.round(v*10)/10);
  if(v>=50)return String(Math.round(v/5)*5);
  if(v>=10)return String(Math.round(v));
  let whole=Math.floor(v),rem=v-whole,best=FRAC_OUT[0];
  for(const f of FRAC_OUT)if(Math.abs(rem-f[0])<Math.abs(rem-best[0]))best=f;
  if(best[0]===1){whole++;best=FRAC_OUT[0]}
  return (whole?String(whole):'')+best[1]||'0';
}
function scaleQty(q,f){
  if(!q||f===1)return q;
  let skipped=false;
  return q.replace(/\d+(?:\.\d+)?[½¼¾⅓⅔⅛]?|[½¼¾⅓⅔⅛]/g,(m,off,str)=>{
    const before=str.slice(Math.max(0,off-2),off),after=str.slice(off+m.length);
    // don't scale piece sizes ("5 × 250 g") or dimensions ("2 × 2 cm", "2.5 cm cubes")
    let skip=/×\s?$/.test(before)||/^\s?cm/.test(after)||/^\s?×\s?\d+(\.\d+)?\s?cm/.test(after)||(/[–-]\s?$/.test(before)&&skipped);
    skipped=skip;if(skip)return m;
    const v=(parseFloat(m)||0)+(FRAC[m.slice(-1)]||0);
    return fmtAmount(v*f,m.includes('.'));
  }).replace(/\b(\d{4,}) (g|ml)\b/g,(m,v,u)=>`${Math.round(v/100)/10} ${u==='g'?'kg':'L'}`);
}

function V_imports(){

    :(skip.length?`<button class="btn block" data-act="impRestore" ${nT?'':'disabled style="opacity:.5"'}>Import ${nT} ticked</button>`:'');

async function resizeImage(file){
  const url=URL.createObjectURL(file);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("That file isn't a photo the app can read."));i.src=url});
  const k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);return c.toDataURL('image/jpeg',0.85);
}
function normDraft(d){return {name:d.name||'New recipe',type:RTYPES.includes(d.type)?d.type:'Vegetarian',serves:+d.serves||4,prep:+d.prep_mins||0,cook:+d.cook_mins||0,
  tags:(d.tags||[]).slice(0,3),source:d.source||'',notes:(d.notes||[]).map(String),
  ing:(d.ingredients||[]).filter(x=>x&&x.item).map(x=>[String(x.qty||''),String(x.item),String(x.note||''),{g:x.section||'',s:!!x.staple||isStaple(String(x.item)),o:!!x.optional}]),
  steps:(d.steps||[]).map(x=>[String(x.title||''),String(x.text||'')])}}
async function startSnap(file){
  S.snap={step:'reading',img:null};sheetSnap();
  try{const dataUrl=await resizeImage(file);if(!S.snap)return;S.snap.img=dataUrl;sheetSnap();
    const j=await api('ocr',{image:dataUrl.split(',')[1],mime:'image/jpeg'});if(!S.snap)return;
    S.snap={step:'review',draft:normDraft(j.draft),photo:j.photo_url};sheetSnap()}
  catch(e){if(S.snap){S.snap={step:'error',msg:e.message};sheetSnap()}}
}

let drag=null;
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest('[data-drag]');if(!g||e.button>0)return;
  e.preventDefault();
  const row=g.closest('.row'),rc=row.getBoundingClientRect(),ghost=row.cloneNode(true);
  ghost.classList.add('drag-ghost');Object.assign(ghost.style,{width:rc.width+'px',left:rc.left+'px',top:rc.top+'px'});
  document.body.appendChild(ghost);row.classList.add('dragging');document.body.classList.add('is-dragging');
  drag={src:g.dataset.drag,k:g.dataset.k,d:+g.dataset.d,h:+g.dataset.h,tid:+g.dataset.id,ghost,row,dx:e.clientX-rc.left,dy:e.clientY-rc.top,over:null,x:e.clientX,y:e.clientY};
  try{g.setPointerCapture(e.pointerId)}catch(_){}
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;e.preventDefault();drag.x=e.clientX;drag.y=e.clientY;
  drag.ghost.style.left=(e.clientX-drag.dx)+'px';drag.ghost.style.top=(e.clientY-drag.dy)+'px';
  const t=document.elementFromPoint(e.clientX,e.clientY);const z=t&&t.closest('[data-drop]');
  const OK={todo:['todo'],gro:['gcat'],hold:['day'],day:['day','hold']};const zz=z&&(OK[drag.src]||[]).includes(z.dataset.drop)?z:null;
  if(zz!==drag.over){drag.over&&drag.over.classList.remove('over','over-top','over-bot');drag.over=zz;zz&&zz.dataset.drop!=='todo'&&zz.classList.add('over')}
  if(zz&&zz.dataset.drop==='todo'){const r=zz.getBoundingClientRect(),top=e.clientY<r.top+r.height/2;zz.classList.toggle('over-top',top);zz.classList.toggle('over-bot',!top);drag.before=top}
  if(e.clientY<90)window.scrollBy(0,-12);else if(e.clientY>innerHeight-60)window.scrollBy(0,12);
},{passive:false});
function moveTodo(tid,target,before){
  // reorder within what's on screen, then number the open untimed ones so the order is saved
  const shown=[...document.querySelectorAll('[data-drop="todo"]')].map(r=>+r.dataset.id).filter((v,i,a)=>a.indexOf(v)===i);
  if(!shown.includes(tid)||!shown.includes(target))return;
  shown.splice(shown.indexOf(tid),1);let at=shown.indexOf(target);if(!before)at++;shown.splice(at,0,tid);
  const list=shown.map(i=>todos.find(t=>t.id===i)).filter(t=>t&&!t.done&&!t.time);
  const base=Math.min(0,...todos.filter(t=>t.sort!=null).map(t=>t.sort));list.forEach((t,i)=>t.sort=base+i*10);
}
function endDrag(ok){
  if(!drag)return;const {src,d,h,over}=drag;
  drag.ghost.remove();drag.row.classList.remove('dragging');over&&over.classList.remove('over','over-top','over-bot');const before=drag.before,tid=drag.tid,gk=drag.k;document.body.classList.remove('is-dragging');drag=null;
  if(!ok||!over)return;
  const kind=over.dataset.drop,to=+over.dataset.d;
  if(src==='gro'&&kind==='gcat'){const c=over.dataset.c,lines=groceries.filter(x=>keyOf(x.name)===gk);if(lines.length&&lines[0].cat!==c){lines.forEach(x=>x.cat=c);USER_CAT[gk]=c;render();toast(`${lines[0].name} moved to ${c}. Remembered for next time.`)}return}
  if(src==='todo'&&kind==='todo'){const target=+over.dataset.id;if(target!==tid)moveTodo(tid,target,before);render();return}
  if(src==='hold'&&kind==='day'){const it=holding.find(x=>x.hid===h);holding=holding.filter(x=>x!==it);placeOnDay(it.rid,to,it.hid);toast(`Planned for ${dayName(to)}`)}
  else if(src==='day'&&kind==='day'&&to!==d){const a=meals[d],b=meals[to],pa=mealPid[d],pb=mealPid[to];meals[to]=a;mealPid[to]=pa;if(b){meals[d]=b;mealPid[d]=pb}else{delete meals[d];delete mealPid[d]}toast(b?`Swapped ${dayName(d)} and ${dayName(to)}`:`Moved to ${dayName(to)}`)}
  else if(src==='day'&&kind==='hold'){holding.push({hid:mealPid[d]||id(),rid:meals[d]});delete meals[d];delete mealPid[d];toast('Moved back to "To allocate"')}
  render();
}

  else if(a==='pushTest'){const st=pushState();api('testpush',{endpoint:st&&st.endpoint}).then(()=>toast('Test sent. It should arrive in a few seconds.')).catch(e=>{if(e.code==='nodevice'){setPush(null);render()}toast("Test didn't send: "+e.message)})}
  else if(a==='pushPref'){const st=pushState();if(!st)return;st.prefs[el.dataset.k]=!st.prefs[el.dataset.k];setPush(st);render();
    api('pushprefs',{endpoint:st.endpoint,prefs:st.prefs}).catch(e=>{if(e.code==='nodevice'){setPush(null);render()}toast("Couldn't change that: "+e.message)})}});
// if the phone dropped the subscription (or swapped it), keep the backend in step
if(pushSupported()&&pushState())navigator.serviceWorker.ready.then(r=>r.pushManager.getSubscription()).then(sub=>{const st=pushState();if(!st)return;
  if(!sub){setPush(null);api('unsubscribe',{endpoint:st.endpoint}).catch(()=>{});if(S.view==='settings')render();return}
  if(sub.endpoint!==st.endpoint){api('subscribe',{sub:sub.toJSON(),label:isIOS?'iPhone':'Android phone',prefs:st.prefs}).then(()=>{api('unsubscribe',{endpoint:st.endpoint}).catch(()=>{});setPush({...st,endpoint:sub.endpoint})}).catch(()=>{})}}).catch(()=>{});
// home-screen shortcuts (long-press the icon) open straight to a screen
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS.some(x=>x[0]===v)&&v!==S.view)go(v)});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
applyTheme();render();
if(/[#&]id_token=|[#&]error=/.test(location.hash))finishGoogleSignIn();
else if(!cfg()||!cfg().url||(!cfg().session&&!cfg().key))openSetup();
else{const c=readCache();if(c){try{applyTabs(c.tabs);setStatus('loading')}catch(e){SNAP=null}}
  loadAll().catch(e=>{setStatus(e.code==='net'?'net':'error',e.message);if(e.code==='auth')openSetup(e.message)})}
</script>
