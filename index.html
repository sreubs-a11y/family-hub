<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2F5BEA">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Family Hub">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
input[type=url],input[type=password]{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.proto.st-saving{color:var(--accent)}
.proto.st-error,.proto.st-net{color:var(--protein)}
.setup{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));overflow:auto}
.setup-card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
.setup-card h1{font-size:30px;font-weight:800}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px}
.setup-card code{font-size:11px;word-break:break-all;background:var(--surface-2);padding:1px 4px;border-radius:4px}
.setup-card .link{align-self:center}
.err{background:var(--surface);border:1px solid var(--protein);color:var(--protein);border-radius:12px;padding:10px 12px;font-size:14px}

/* Layout: single phone column, sticky header with a menu button top-left opening a side drawer; colour-coded entries like a fridge calendar */
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --surface-2:#E8EDF2; --line:#D9E0E7;
  --fg:#16202B; --muted:#5E6B78; --accent:#2F5BEA; --accent-ink:#FFFFFF; --accent-soft:#E3EAFE;
  --pickup:#C77700; --pickup-soft:#FFF1DC;
  --meal:#2E8A57; --meal-soft:#E0F3E8;
  --event:#7A4FD0; --event-soft:#EFE7FD; --protein:#C2453A; --bday:#C2417A; --bday-soft:#FCE4EF;
  --scrim:rgba(10,15,20,.45);
  --font-display:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --font-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#18212B; --surface-2:#212C38; --line:#2C3946;
  --fg:#E8EEF4; --muted:#93A1AF; --accent:#7C9BFF; --accent-ink:#0F151C; --accent-soft:#1F2C52;
  --pickup:#F0A53A; --pickup-soft:#3A2B12; --meal:#5CC48A; --meal-soft:#173325;
  --event:#B596FF; --event-soft:#2A2145; --protein:#FF8A7A; --bday:#F58BB8; --bday-soft:#3A1C2B; --scrim:rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#18212B; --surface-2:#212C38; --line:#2C3946;
  --fg:#E8EEF4; --muted:#93A1AF; --accent:#7C9BFF; --accent-ink:#0F151C; --accent-soft:#1F2C52;
  --pickup:#F0A53A; --pickup-soft:#3A2B12; --meal:#5CC48A; --meal-soft:#173325;
  --event:#B596FF; --event-soft:#2A2145; --protein:#FF8A7A; --bday:#F58BB8; --bday-soft:#3A1C2B; --scrim:rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:520px;margin:0 auto}
body.wide .app{max-width:1400px}
@media (min-width:700px){body.wide .mcal{margin-inline:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}body.wide .calbar{padding:10px 12px}}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;display:flex;align-items:center;gap:12px}
.menu-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;padding:0}
header.top .ttl{flex:1;min-width:0}
header.top .eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
header.top h1{font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.proto{font-size:11px;font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:4px 9px;white-space:nowrap}

main{display:flex;flex-direction:column;gap:22px;padding-top:6px}
section{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-head h2{font-size:16px;font-weight:700}
.hint{font-size:13px;color:var(--muted)}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;padding:4px 0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);min-width:0;width:100%;background:none;text-align:left;border-left:0;border-right:0;border-bottom:0}
.rows>.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted)}
.time{font-size:13px;font-weight:600;width:56px;flex:none;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.tag.pickup{background:var(--pickup-soft);color:var(--pickup)}
.tag.meal{background:var(--meal-soft);color:var(--meal)}
.tag.event{background:var(--event-soft);color:var(--event)}
.tag.plain{background:var(--surface-2);color:var(--muted)}
.stripe{width:4px;align-self:stretch;border-radius:4px;flex:none}
.stripe.birthday{background:var(--bday)}.tag.birthday{background:var(--bday-soft);color:var(--bday)}.dots .birthday{background:var(--bday)}
.stripe.pickup{background:var(--pickup)}.stripe.meal{background:var(--meal)}.stripe.event{background:var(--event)}
.who{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.who.R{background:var(--accent-soft);color:var(--accent)}
.who.T{background:var(--event-soft);color:var(--event)}
.who.B{background:var(--surface-2);color:var(--muted)}
.by{font-weight:600}.by.R{color:var(--accent)}.by.T{color:var(--event)}
.lock{display:inline-flex;vertical-align:-2px;margin-right:2px}
.me{display:flex;align-items:center;gap:10px;padding:10px;margin:0 0 10px;background:var(--surface-2);border-radius:12px;font-size:13px}
.me .main{flex:1;min-width:0}
.me b{display:block;font-size:15px}
.btn.icon{padding:0 14px;display:grid;place-items:center;align-self:stretch}

.dinner{display:flex;gap:14px;align-items:center;padding:14px;background:var(--meal-soft);border:0;border-radius:var(--r);text-align:left;width:100%}
.dinner .ico{width:46px;height:46px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--meal);flex:none}
.dinner .k{font-size:12px;font-weight:600;color:var(--meal);text-transform:uppercase;letter-spacing:.06em}
.dinner .n{font-family:var(--font-display);font-weight:700;font-size:18px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tile .big{font-family:var(--font-display);font-size:26px;font-weight:800}
.tile .s{font-size:13px;color:var(--muted)}

.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:var(--surface);flex:none;display:grid;place-items:center;padding:0}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.done .t{text-decoration:line-through;color:var(--muted)}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pager h2{font-size:17px;font-weight:700}
.pg{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;font-size:18px;font-weight:700}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:0;background:var(--surface);border-radius:12px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.day .dn{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
.day .dd{font-family:var(--font-display);font-weight:700;font-size:17px}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:5px;height:5px;border-radius:50%}
.day.sel,.mcell.sel{background:var(--accent);color:var(--accent-ink)}
.day.sel .dn{color:var(--accent-ink);opacity:.8}
.dots .pickup{background:var(--pickup)}.dots .meal{background:var(--meal)}.dots .event{background:var(--event)}

.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.month .wd{font-size:11px;font-weight:600;color:var(--muted);text-align:center;text-transform:uppercase;padding-bottom:2px}
.mcell{border:0;background:var(--surface);border-radius:10px;aspect-ratio:1/1.05;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;min-width:0}
.mcell .dd{font-weight:600;font-size:15px}
.mcell.today:not(.sel){box-shadow:inset 0 0 0 2px var(--accent)}
.mcell.past:not(.sel) .dd{color:var(--muted)}
.mcell.blank{background:none}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.addbar{display:flex;gap:8px}
input[type=text],input[type=number],input[type=date],input[type=time],select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.aisle{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:2px 2px 0}

.snap{display:flex;gap:14px;align-items:center;padding:16px;border:1.5px dashed var(--accent);background:var(--accent-soft);border-radius:var(--r);width:100%;text-align:left;color:var(--fg)}
.snap .ico{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.recipes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rcard{padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.rcard .sw{height:64px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--meal);background:var(--meal-soft)}
.rcard .b{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.rcard .t{font-weight:600}
.rcard .s{font-size:12px;color:var(--muted)}
.dcol{width:44px;flex:none;display:flex;flex-direction:column;line-height:1.1}
.dcol b{font-size:13px}
.dcol span{font-size:12px;color:var(--muted)}
.holding{border-style:dashed}
.grip{touch-action:none;cursor:grab;width:30px;height:38px;margin:-8px 0 -8px -6px;display:grid;place-items:center;color:var(--muted);flex:none;border-radius:8px}
.grip:active{cursor:grabbing}
.drag-ghost{position:fixed;z-index:40;pointer-events:none;background:var(--surface);box-shadow:0 10px 28px rgba(0,0,0,.22);border-radius:12px;border:1px solid var(--line)!important;opacity:.96}
.dragging{opacity:.3}
.over{background:var(--meal-soft)!important;box-shadow:inset 0 0 0 2px var(--meal)}
body.is-dragging{user-select:none;-webkit-user-select:none}
.syncbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stripe.todo{background:var(--accent)}.tag.todo{background:var(--accent-soft);color:var(--accent);margin-right:4px}
.minis{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mini{display:inline-flex;align-items:center;gap:4px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 2px 0 6px;font-size:13px;flex:0 0 auto;max-width:100%}
.mini input,.mini select{border:0!important;background:none!important;padding:0 4px!important;font-size:13px!important;width:auto!important;min-width:0;height:32px;color:var(--fg)}
.mini input[type=date]{max-width:8em;font-variant-numeric:tabular-nums}.mini input[type=time]{max-width:5.6em}
.minis .segsm button{padding:5px 8px;font-size:12.5px}
.minis .segsm{height:34px;padding:2px}
.mini{gap:2px}
.mini-l{font-size:12px;font-weight:600;color:var(--muted)}
.mini.chip{padding:0 10px;gap:5px}
.minis .segsm{height:34px;align-items:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tgrip{margin:-8px -4px -8px -8px;width:24px}
.tgrip-space{width:16px;flex:none;margin-left:-8px}
.row.over-top{box-shadow:inset 0 3px 0 var(--accent)}
.row.over-bot{box-shadow:inset 0 -3px 0 var(--accent)}
.mcal{margin-inline:calc(-1 * max(16px, env(safe-area-inset-left,0px)));margin-top:-6px}
.calbar{display:flex;align-items:center;gap:6px;padding:0 max(12px, env(safe-area-inset-left,0px)) 8px;flex-wrap:wrap}
.calbar h2{font-size:18px;font-weight:800;min-width:0;margin-right:auto}
.calbar .pg{width:34px;height:34px;font-size:17px}
.calbar-r{display:flex;align-items:center;gap:6px;margin-left:auto}
.calbar .segsm button{padding:5px 8px;font-size:12.5px}
.calbar .btn.sm{padding:6px 10px}
.mgrid{border-top:1px solid var(--line);background:var(--surface)}
.mwh,.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mwd{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0;border-bottom:1px solid var(--line);background:var(--bg)}
.wk{position:relative;min-height:calc((100dvh - 210px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) / var(--weeks));row-gap:2px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.wk>.mc{grid-row:1 / -1;border:0;border-right:1px solid var(--line);background:var(--surface);margin:0 0 -4px;padding:0;cursor:pointer;min-width:0}
.wk>.mc:nth-child(13){border-right:0}
.wk>.mc.out{background:var(--bg)}
.wk>*:not(.mc){position:relative;pointer-events:none;min-width:0}
.mcd{grid-row:1;font-size:12px;font-weight:600;justify-self:center;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;margin:2px 0 1px}
.mcd.out{color:var(--muted)}
.mcd.today{background:var(--accent);color:var(--accent-ink)}
.mcl{display:flex;flex-direction:column;gap:2px;padding:0 1px}
.evc.bar{margin:0 2px;-webkit-line-clamp:1;white-space:nowrap;text-overflow:ellipsis;display:block}
.evc.bar.cl{margin-left:0;border-top-left-radius:0;border-bottom-left-radius:0}
.evc.bar.cr{margin-right:0;border-top-right-radius:0;border-bottom-right-radius:0}
.evc{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;font-size:10px;line-height:1.25;font-weight:600;border-radius:4px;padding:1px 2px;overflow:hidden;overflow-wrap:anywhere;hyphens:auto;min-width:0;letter-spacing:-.1px}
.evc .et{display:none}
@media (min-width:700px){.evc{-webkit-line-clamp:2;padding:1px 4px}.evc .et{display:inline}.evc.bar{padding:1px 6px}}
.evc.event{background:var(--event-soft);color:var(--event)}
.evc.pickup,.evc.dropoff{background:var(--pickup-soft);color:var(--pickup)}
.evc.birthday{background:var(--bday-soft);color:var(--bday)}
.evc.meal{background:var(--meal-soft);color:var(--meal)}
.evc.todo{background:var(--accent-soft);color:var(--accent)}
.evc.holiday,.evc.booking{background:var(--surface-2);color:var(--fg)}
.evmore{font-size:10px;font-weight:700;color:var(--muted);padding:0 3px}
@media (min-width:700px){.evc{font-size:12px}.mcd{font-size:13px}}
.late{color:var(--protein);font-weight:600}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--meal-soft);color:var(--fg)}
.banner .main{flex:1;min-width:0}
button.who{border:0;padding:0}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;line-height:1.5}
.pill.new{background:var(--accent);color:var(--accent-ink);vertical-align:2px;margin-left:4px}
.newbox{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;flex:none}
.cat{font-weight:600}
.c0{color:var(--protein)} .dot.c0{background:var(--protein)}
.c1{color:var(--meal)} .dot.c1{background:var(--meal)}
.c2{color:var(--accent)} .dot.c2{background:var(--accent)}
.c3{color:var(--pickup)} .dot.c3{background:var(--pickup)}
.c4{color:var(--event)} .dot.c4{background:var(--event)}
.c5{color:var(--muted)} .dot.c5{background:var(--muted)}
.qty.buy,.buy{color:var(--accent);font-weight:600}
.facts .scaler{display:grid;grid-template-columns:1fr auto;column-gap:6px;flex:1.3}
.scaler b,.scaler>span:not(.stepper){grid-column:1}
.stepper{grid-column:2;grid-row:1/3;align-self:center;display:flex;gap:4px}
.stepper button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-size:18px;font-weight:700;line-height:1;padding:0}
.stepper button:disabled{opacity:.4}
.scalenote{font-size:13px;color:var(--fg);background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.q.scaled{color:var(--accent)}
button.row.evbtn{cursor:pointer}
.dupchip{display:inline-block;font-size:11px;font-weight:700;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:2px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav .lbl{text-align:center;flex:1}
.daynav .lbl b{display:block;font-family:var(--font-display);font-size:17px}
.daynav .lbl span{font-size:12px;color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.swatch{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600}
.swatch i{width:34px;height:34px;border-radius:50%;display:block;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.swatch.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.kind{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--surface-2);color:var(--muted);white-space:nowrap}

function parseAmt(q){const m=(q||'').replace(/\(.*?\)/g,'').trim().match(/^(\d+(?:\.\d+)?[½¼¾⅓⅔⅛]?|[½¼¾⅓⅔⅛])\s*(.*)$/);if(!m)return null;
  let v=(parseFloat(m[1])||0)+(FRAC[m[1].slice(-1)]||0),u=m[2].trim().toLowerCase();if(/[×x]/.test(u))return null;
  if(u==='kg'){v*=1000;u='g'}if(u==='l'){v*=1000;u='ml'}u=u.replace(/s$/,'');return {v,u}}

  let v=p.reduce((a,b)=>a+b.v,0),u=p[0].u;if(u==='g'&&v>=1000)return `${Math.round(v/100)/10} kg`;if(u==='ml'&&v>=1000)return `${Math.round(v/100)/10} L`;

     if(!t.priv&&t.who!==was&&t.who!==S.me){notify(t.who,'todo',t.id,`${PEOPLE[S.me]} assigned you a to-do`);toast(`Updated. ${t.who==='B'?PEOPLE[OTHER()]:PEOPLE[t.who]} will get a notification.`)}else toast('To-do updated');break}
   case'delTodo':todos=todos.filter(x=>x.id!==n('id'));closeSheet();render();toast('To-do deleted');break;
   case'dropHold':{const h=holding.find(x=>x.hid===n('h')),m=mealOf(h.rid);const go_=()=>{const c=removeMeal(h.hid);holding=holding.filter(x=>x!==h);closeSheet();render();toast(`${m.name} removed${c?` with ${c} grocery item${c>1?'s':''}`:''}`)};
     if(el.dataset.ok){go_();break}const cnt=groceries.filter(g=>g.pid===h.hid&&!g.done).length;if(!cnt){go_();break}sheetRemoveMeal(m.name,'the meal plan',cnt,'dropHold',`data-h="${h.hid}"`);break}
   case'filter':S.filter=el.dataset.v;render();break;

   case'clearDone':if(el.dataset.l==='groceries')groceries=groceries.filter(s=>!s.done);else shopping=shopping.filter(s=>!s.done);render();break;

   case'scaleReset':delete S.serves[n('id')];render();break;
   case'rSort':S.rSort=el.dataset.v;render();break;
   case'cookedToday':{const r=recipeById(n('id'));cookedRows.push({id:id(),rid:r.id,name:r.name,d:0});syncCooked();render();toast('Logged. '+r.name+' cooked today.');break}
   case'gView':S.gView=el.dataset.v;render();break;

   case'setGroCat':{const k=el.dataset.k,c=el.dataset.c,rem=$('#groRemember').classList.contains('on');groceries.filter(g=>keyOf(g.name)===k).forEach(g=>g.cat=c);if(rem)USER_CAT[k]=c;closeSheet();render();toast(rem?`Moved to ${c}. Remembered for next time.`:`Moved to ${c}`);break}

   case'seenAll':notes.forEach(x=>{if(x.to===S.me)x.read=true});render();break;
   case'openNote':{const x=notes.find(y=>y.id===n('n'));x.read=true;if(x.kind==='todo')go('todos');else{S.sel=events.find(e=>e.id===x.ref).d;S.calMode='week';S.weekStart=Math.floor(S.sel/7)*7;go('calendar')}break}
   case'todoToggle':{const t=todos.find(x=>x.id===n('id'));t.done=!t.done;if(t.done&&t.rep&&t.date&&!todos.some(x=>x!==t&&x.title===t.title&&x.date&&isoOf(x.date)===isoOf(nextDate(t.date,t.rep.f)))){const nx={...t,id:id(),done:false,date:nextDate(t.date,t.rep.f)};t.spawned=true;todos.push(nx);render();toast(`Done. Next one: ${DN[nx.date.getDay()]} ${nx.date.getDate()} ${MN[nx.date.getMonth()]}`)}else render();break}

     const priv=el.dataset.priv==='1';const d=diff(new Date($('#evDate').value+'T00:00'));const g=!priv&&$('#evG').classList.contains('on');
     const rp=$('#evRep').value,un=$('#evUntil').value,en=$('#evEnd').value;const endD=en?diff(new Date(en+'T00:00')):null;const ne={id:id(),d,endD:endD!=null&&endD>d?endD:null,time:$('#evTime').value||'',title:t,type:$('#evType').value,who:$('#evWho').value,by:S.me,priv,gcal:g,src:'app',rep:rp?{f:rp,until:un?diff(new Date(un+'T00:00')):null}:null};events.push(ne);if(!priv&&ne.who!==S.me)notify(ne.who,'event',ne.id,`${PEOPLE[S.me]} assigned you ${ne.type==='pickup'?'a pick-up':'an event'}`);
     S.sel=d;closeSheet();render();toast(priv?'Private event saved. Only you can see it.':g?'Saved and added to Google Calendar':'Saved in the app only');break}
   case'snap':$('#photo').value='';$('#photo').click();break;
   case'saveSnap':{const d=S.snap.draft,prep=+$('#snPrep').value||0,cook=+$('#snCook').value||0;
     const r={id:id(),name:$('#snTitle').value.trim()||d.name,type:$('#snType').value,prep,cook,mins:prep+cook,serves:+$('#snServes').value||d.serves,tags:d.tags,source:$('#snSource').value.trim(),photo:S.snap.photo||'',srcKind:'photo',notes:d.notes,steps:d.steps,ing:d.ing,cooked:[]};
     recipes.unshift(r);closeSheet();S.from='recipes';S.recipe=r.id;render();toast('Recipe saved');break}

document.addEventListener('submit',e=>{
  const f=e.target.dataset.form;if(!f)return;e.preventDefault();
  if(f==='custom'){const v=$('#customMeal').value.trim();if(!v){$('#customMeal').focus();return}const d=+e.target.dataset.d;placeOnDay(v,d,id());closeSheet();render();toast(`${v} planned for ${dayName(d)}`);return}
  if(f==='shop'){const v=$('#shopInput').value.trim();if(!v)return;shopping.unshift({id:id(),name:cap(v),qty:'',cat:$('#shopCat').value,by:S.me,done:false})}
  if(f==='gro'){const v=$('#groInput').value.trim();if(!v)return;addGro(v,'',null,S.me);toast(`${cap(v)} added to ${catFor(v)}`)}
  if(f==='todo'){const v=$('#todoInput').value.trim();if(!v)return;const priv=$('#todoPriv').classList.contains('on');const dv=$('#todoDue').value;
    const rp=$('#todoRep').value;const t={id:id(),title:v,who:priv?S.me:$('#todoWho').value,by:S.me,priv,date:dv?new Date(dv+'T00:00'):null,dt:$('#todoDT').value,time:dv?$('#todoTime').value||'':'',rep:rp&&dv?{f:rp}:null,done:false};t.sort=Math.min(0,...todos.filter(x=>!x.done&&x.sort!=null).map(x=>x.sort))-10;todos.unshift(t);
    if(!priv&&t.who!==S.me){notify(t.who,'todo',t.id,`${PEOPLE[S.me]} assigned you a to-do`);toast(`To-do added. ${t.who==='B'?PEOPLE[OTHER()]:PEOPLE[t.who]} will get a notification.`)}else toast(priv?'Private to-do added. Only you can see it.':'To-do added')}
  render();const inp=$({shop:'#shopInput',gro:'#groInput',todo:'#todoInput'}[f]);inp&&inp.focus();
});
$('#photo').addEventListener('change',e=>{
  const file=e.target.files[0];if(file)startSnap(file);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
document.addEventListener('change',e=>{if(['bdDay','bdMonth'].includes(e.target.id))bdHint();if(e.target.id==='evRep')$('#evUntilF').hidden=!e.target.value;
  if(e.target.id==='todoWhen'){const v=e.target.value,f=$('#todoPickF'),d=$('#todoDue');f.hidden=v!=='pick';if(v==='none')d.value='';else if(v!=='pick')d.value=isoOf(addDays(TODAY,+v));else if(!d.value)d.value=isoOf(TODAY)}});
document.addEventListener('input',e=>{if(['bdYear','bdAge'].includes(e.target.id)){bdHint();return}if(e.target.id==='rSearch'){S.rq=e.target.value;const pos=e.target.selectionStart;render();const i=$('#rSearch');if(i){i.focus();i.setSelectionRange(pos,pos)}return}
  if(e.target.id!=='groInput')return;const v=e.target.value.trim(),h=$('#groHint');if(h)h.innerHTML=v?`Goes in <b>${esc(catFor(v))}</b>`:'Items sort themselves into categories. Tap one to see what each recipe needs or change its category.'});
const h=(location.hash||'').slice(1);if(VIEWS.some(v=>v[0]===h))S.view=h;
// ---------- first run, saving and refreshing ----------
function redirectUri(){return location.origin+location.pathname.replace(/index\.html$/,'')}
function openSetup(err,forcePass){
  const c=cfg()||{};S.cfgMe=c.me||'';
  const stage=!c.url||!c.checked?'link':(c.clientId&&!forcePass?'google':'pass');
  const errHtml=err?`<div class="err" role="alert">${esc(err)}</div>`:'';
  let inner;
  if(stage==='link')inner=`<p class="hint">Connect this phone to your family's sheet. You only do this once.</p>${errHtml}
   <div class="field"><label for="cfgUrl">Backend link</label><input id="cfgUrl" type="url" autocomplete="off" value="${esc(c.url||'')}" placeholder="https://script.google.com/macros/s/…/exec"></div>
   <button class="btn block" data-act="cfgNext" type="button">Continue</button>`;
  else if(stage==='google')inner=`<p class="hint">Sign in with the Google account listed for you on the People tab.</p>${errHtml}
   <button class="btn block gbtn" data-act="gSignIn" type="button"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#fff"/><path d="M17.6 12.2c0-.4 0-.8-.1-1.2H12v2.3h3.2a2.7 2.7 0 0 1-1.2 1.8v1.5h1.9c1.1-1 1.7-2.6 1.7-4.4z" fill="#4285F4"/><path d="M12 18c1.6 0 3-.5 3.9-1.4l-1.9-1.5c-.5.4-1.2.6-2 .6-1.5 0-2.8-1-3.3-2.4H6.8v1.5A6 6 0 0 0 12 18z" fill="#34A853"/><path d="M8.7 13.3a3.6 3.6 0 0 1 0-2.6V9.2H6.8a6 6 0 0 0 0 5.6l1.9-1.5z" fill="#FBBC05"/><path d="M12 8.4c.9 0 1.6.3 2.2.9l1.7-1.7A6 6 0 0 0 6.8 9.2l1.9 1.5c.5-1.4 1.8-2.3 3.3-2.3z" fill="#EA4335"/></svg>Sign in with Google</button>
   ${c.passcode?'<button class="link" data-act="usePass" type="button">Use the family passcode instead</button>':''}
   <button class="link" data-act="cfgLink" type="button">Change the backend link</button>
   <p class="hint" style="font-size:12px">Redirect URI for Google Cloud: <code>${esc(redirectUri())}</code></p>`;
  else inner=`<p class="hint">Type the family passcode and pick who's using this phone.</p>${errHtml}
   <div class="field"><label for="cfgKey">Family passcode</label><input id="cfgKey" type="password" autocomplete="current-password" value="${esc(c.key||'')}"></div>
   <div class="field"><label>Who's using this phone?</label><div class="segsm" role="group">${['R','T'].map(w=>`<button type="button" class="${S.cfgMe===w?'on':''}" data-act="cfgMe" data-v="${w}">${esc(PEOPLE[w])}</button>`).join('')}</div></div>
   <button class="btn block" data-act="cfgSave" type="button">Connect</button>
   <button class="link" data-act="cfgLink" type="button">Change the backend link</button>`;
  $('#overlay').innerHTML=`<div class="setup"><form class="setup-card" data-form="cfg" data-stage="${stage}"><h1>Family Hub</h1>${inner}
   ${SNAP?'<button class="btn ghost block" type="button" data-act="cfgCancel">Cancel</button>':''}</form></div>`;
}
async function setupNext(){
  const url=$('#cfgUrl').value.trim();
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){openSetupMsg({url},'The backend link should start with https://script.google.com/');return}
  try{const j=await rawApi(url,{action:'config'});setCfg({url,checked:true,clientId:j.clientId||'',passcode:!!j.passcode});
    if(!j.clientId&&!j.passcode){openSetupMsg({url,checked:false},'The backend has no GOOGLE_CLIENT_ID or PASSCODE set yet (Project Settings → Script properties).');return}
    openSetup()}
  catch(e){openSetupMsg({url},e.message)}
}
function openSetupMsg(c,msg){setCfg({...(cfg()||{}),...c});openSetup(msg)}
function googleSignIn(){
  const c=cfg(),rnd=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');
  const st={state:rnd(),nonce:rnd()};try{localStorage.setItem('fh-oauth',JSON.stringify(st))}catch(e){}
  const q=new URLSearchParams({client_id:c.clientId,redirect_uri:redirectUri(),response_type:'id_token',scope:'openid email',nonce:st.nonce,state:st.state,prompt:'select_account'});
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+q;
}
async function finishGoogleSignIn(){
  const p=new URLSearchParams(location.hash.slice(1));history.replaceState(null,'',location.pathname+location.search);
  let st={};try{st=JSON.parse(localStorage.getItem('fh-oauth')||'{}');localStorage.removeItem('fh-oauth')}catch(e){}
  if(p.get('error')){openSetup(p.get('error')==='access_denied'?'Sign-in was cancelled.':'Google said: '+p.get('error'));return}
  if(!st.state||p.get('state')!==st.state){openSetup('That sign-in came back without the right check. Please try again.');return}
  const c=cfg();
  try{const j=await rawApi(c.url,{action:'signin',idToken:p.get('id_token'),nonce:st.nonce});
    setCfg({url:c.url,checked:true,clientId:c.clientId,passcode:c.passcode,session:j.session,me:j.me,email:j.email});S.me=j.me;if(j.name)PEOPLE[j.me]=j.name;
    await loadAll();$('#overlay').innerHTML='';render();toast('Signed in as '+PEOPLE[S.me])}
  catch(e){openSetup(e.message)}
}
async function signOut(){const c=cfg();try{await api('signout')}catch(e){}setCfg({url:c.url,checked:true,clientId:c.clientId,passcode:c.passcode});SNAP=null;openSetup()}
async function connect(){
  const key=$('#cfgKey').value;if(!S.cfgMe){openSetupMsg({key},"Pick who's using this phone.");return}
  const old=cfg();setCfg({...old,key,me:S.cfgMe,session:''});S.me=S.cfgMe;
  try{await api('ping');SNAP=null;await loadAll();$('#overlay').innerHTML='';S.filter='all';render();toast('Connected as '+PEOPLE[S.me])}
  catch(e){setCfg({...old,key});openSetup(e.message,true)}
}
async function doSync(){
  sheet(`<h3>Syncing ${esc(PEOPLE[S.me])}'s calendars</h3><div class="spin" role="status" aria-label="Syncing"></div><div class="hint" style="text-align:center">Pulling your calendars and pushing changes. This can take up to a minute.</div>`);
  try{const d=diffTabs();if(d.n)await persist();const j=await api('sync');await loadAll();
    sheet(`<h3>Synced ${esc(PEOPLE[S.me])}'s calendars</h3><div class="hint">Only calendars you own were pulled. ${esc(PEOPLE[OTHER()])}'s sync on their own phone; shared ones sync every hour.</div>
     <div class="card rows"><div class="row"><div class="main"><div class="t">${j.added.length} new event${j.added.length===1?'':'s'}${j.updated?`, ${j.updated} updated`:''}${j.removed?`, ${j.removed} removed`:''}</div><div class="s">${j.pushed} pushed to other calendars</div></div></div>
     ${j.duplicates.map(x=>`<div class="row"><div class="main"><div class="t">"${esc(x.title)}" looks like "${esc(x.matches)}"</div><div class="s">${esc(x.calendar)} · kept as a duplicate record, hidden</div></div></div>`).join('')}
     ${j.errors.map(x=>`<div class="row"><div class="main"><div class="t" style="color:var(--protein)">Problem</div><div class="s">${esc(x)}</div></div></div>`).join('')}</div>
     <button class="btn block" data-act="closeSheetBtn">Done</button>`);render()}
  catch(e){sheet(`<h3>Sync didn't finish</h3><div class="hint">${esc(e.message)}</div><button class="btn block" data-act="closeSheetBtn">OK</button>`)}
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&el.dataset.act==='cfgCancel'){$('#overlay').innerHTML='';return}if(el&&el.dataset.act==='cfgLink'){setCfg({...(cfg()||{}),checked:false});openSetup();return}if(SNAP)queueSave()});
document.addEventListener('submit',e=>{if(e.target.dataset.form==='cfg'){e.preventDefault();const st=e.target.dataset.stage;if(st==='link')setupNext();else if(st==='pass')connect();return}if(SNAP)queueSave()});
document.addEventListener('pointerup',()=>{if(SNAP)setTimeout(queueSave,0)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;
  const t=new Date();t.setHours(0,0,0,0);if(t.getTime()!==TODAY.getTime()){location.reload();return}refresh()});
setInterval(()=>{if(document.visibilityState==='visible')refresh()},45000);
window.addEventListener('online',()=>queueSave());
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
applyTheme();render();
if(/[#&]id_token=|[#&]error=/.test(location.hash))finishGoogleSignIn();
else if(!cfg()||!cfg().url||(!cfg().session&&!cfg().key))openSetup();
else loadAll().catch(e=>{setStatus(e.code==='net'?'net':'error',e.message);if(e.code==='auth')openSetup(e.message)});
</script>
